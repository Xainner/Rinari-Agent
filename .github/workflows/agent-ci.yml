name: agent-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run protocol:check
      # Inventario de paridad desktop (documento 02 §2): si un comando aparece
      # o cambia de firma sin regenerarlo, el host Electron se construiría
      # contra una lista incompleta.
      - run: npm run parity:check
      # main y preload se comprueban aparte del renderer: su entorno es Node y
      # Electron, no el DOM (documento 02 §8).
      - run: npm run typecheck:electron
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare optional engine resource directory
        shell: bash
        run: mkdir -p src-tauri/engine-dist
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test
