name: release

# Publica instaladores + artefactos del updater estilo Hermes:
# tag v* -> build Windows -> release (draft) con latest.json firmado.
# La app instalada detecta el release y se auto-actualiza sola.
on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    # G1 keeps the final Tauri transition release available. Electron 0.2.x
    # must not fall through this legacy updater path.
    if: startsWith(github.ref_name, 'v0.1.')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned engine SHA
        id: engine-pin
        shell: pwsh
        run: |
          $manifest = Get-Content engine-manifest.json -Raw | ConvertFrom-Json
          "sha=$($manifest.engine_git_sha)" >> $env:GITHUB_OUTPUT

      - name: Checkout engine (Rinari-CLI)
        uses: actions/checkout@v4
        with:
          repository: Xainner/Rinari-CLI
          ref: ${{ steps.engine-pin.outputs.sha }}
          path: Rinari-CLI

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5

      - name: Tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "tag v$tag != package.json $pkg" }

      - run: npm ci

      - name: Package engine sidecar
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-engine.ps1 `
            -CliRepo "${{ github.workspace }}/Rinari-CLI"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Rinari Agent ${{ github.ref_name }}'
          releaseDraft: true
          includeUpdaterJson: true

  electron-release-blocked:
    if: startsWith(github.ref_name, 'v0.2.')
    runs-on: windows-latest
    steps:
      - name: Refuse an unsigned Electron release before G3
        shell: pwsh
        run: throw 'Electron 0.2.x release is blocked until G3 adds Authenticode signing and latest.yml verification.'
